<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Video Control for Instagram - rebuild self check</title>
        <style>
            body {
                margin: 0;
                font-family: ui-monospace, monospace;
                background: #111;
                color: #ddd;
                padding: 16px;
            }

            .player {
                position: relative;
                width: 640px;
                height: 360px;
                background: #000;
            }

            .player video {
                width: 100%;
                height: 100%;
                display: block;
            }

            .result {
                margin: 4px 0;
            }

            .pass {
                color: #6c6;
            }

            .fail {
                color: #f66;
            }
        </style>
        <link rel="stylesheet" href="../../src/static/styles/instagram.css" />
        <style>
            /* The checks measure the bar width directly after a change. Animations would make the measurement
               depend on timing instead of on the logic under test. */
            * {
                transition: none !important;
                animation: none !important;
            }
        </style>
    </head>
    <body>
        <h1>Rebuild self check</h1>
        <div id="results"></div>
        <div class="player" id="player">
            <video id="video" muted loop playsinline></video>
        </div>
        <script src="./selfcheck.js"></script>
    </body>
</html>
